# nginx config for Trustworthy Science
# Copy to: /etc/nginx/sites-available/trustworthy-science
# Then: ln -s /etc/nginx/sites-available/trustworthy-science /etc/nginx/sites-enabled/
# Replace YOUR_DROPLET_IP with your actual IP or domain name.

server {
    listen 80;
    server_name YOUR_DROPLET_IP;   # replace with IP or domain (e.g. yourdomain.com)

    # Increase body size limit for paper upload requests
    client_max_body_size 10M;

    # ── Backend API — proxy to uvicorn ──────────────────────────────────────
    # All known API path prefixes are forwarded to the Python backend
    location ~ ^/(score|filter|paper|review|api|health|docs|openapi) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Paper scoring can take up to 2 minutes — increase timeouts
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        proxy_connect_timeout 10s;
    }

    # ── Frontend — serve static Vite build ──────────────────────────────────
    location / {
        root       /var/www/trustworthy-science/frontend/dist;
        try_files  $uri $uri/ /index.html;   # React SPA client-side routing

        # Cache static assets aggressively (Vite adds content hashes to filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
        }
    }

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
